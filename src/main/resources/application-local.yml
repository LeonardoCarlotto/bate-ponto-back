spring:
  datasource:
    url: jdbc:h2:file:./data/bate-ponto;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      data-locations: classpath:data-local.sql

server:
  port: 8080

cors:
  allowed-origins: http://localhost:3000

logging:
  level:
    root: INFO
    com.c_code: INFO
    org.hibernate.SQL: INFO
    org.springframework: INFO
    org.springframework.security: INFO
